# AFK config — lets afk-driver run on this repo (read-only producers now; executor later).
# Read by ProjectConfig (afk_driver/config.py). See cdcoonce/afk-agent-system.

# The verification gate the EXECUTOR uses: a slice only reaches a draft PR if this passes.
# Full suite green as of 2026-06-07 (206 passed) — the executor can run here.
test_command = "uv run pytest -q"
permission_mode = "acceptEdits"

# Integration model (live end-to-end test): build onto a standing staging branch
# via the merge-queue, auto-promote afk-sized proposals, and (F2) open the
# staging->main MR. A human still merges staging->main.
integration_target = "afk/staging"
autonomy_frontier = "F2"
auto_promote = true

agent_prompt = """Implement the linked GitHub issue using test-driven development \
(red-green-refactor): write the failing test first, watch it fail, then write the \
minimal code to pass. Keep changes minimal and scoped to the issue's acceptance \
criteria. Do not modify unrelated files. Match the surrounding code style."""

[caps]
max_retries = 2
timeout_seconds = 1800
max_parallel = 2
auto_promote_max = 2

# Cheap default tier; escalated retry reaches opus. Keeps scheduled-drain cost low.
[model]
cheap = "sonnet"
frontier = "opus"
default_tier = "cheap"

# Cross-provider reviewer (afk#761/#788, live 2026-07-19). The reviewer runs on
# OpenAI Codex while the executor stays on Claude — a genuinely independent check
# (same-model review shares blind spots). Needs `codex login` on the fleet host.
# `model` unset => codex's own default; the driver never passes a Claude alias to
# codex (afk#889). This is the first Codex-reviewer pilot; validated live on a real
# orbit-wars diff before enrollment.
[roles.reviewer]
runtime = "codex"

# Scheduled --cycle producers. With auto_promote=true + F2 above, a pass produces
# → auto-promotes (≤2) → drains onto afk/staging → opens the staging→main MR.
# A human still merges staging→main (the merge gate holds).
[cycle]
producers = ["scout", "harvest"]
