[project]
name = "orbit-wars"
version = "0.1.0"
description = "Kaggle Orbit Wars competition bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kaggle-environments>=1.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
