[project]
name = "orbit-wars"
version = "0.1.0"
description = "Kaggle Orbit Wars competition bot"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "kaggle-environments>=1.28.1",
    "optuna>=4.8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# The self-play regression benchmark is slow (~30s) and excluded from the default
# run. Run it with `pytest -m benchmark`; the afk gate runs it via test_command.
addopts = "-m 'not benchmark'"
markers = [
    "benchmark: deterministic self-play regression gate (excluded from default run)",
]
